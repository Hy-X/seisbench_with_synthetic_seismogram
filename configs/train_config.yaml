# Training configuration for seismic phase detection U-Net

# Data parameters
n_samples: 1000
n_channels: 3  # E, N, Z components
n_timesteps: 3000  # Number of time steps in each waveform
n_classes: 3  # Noise, P-wave, S-wave

# Model parameters
dropout: 0.1

# Training parameters
batch_size: 16
num_workers: 4
learning_rate: 0.001
weight_decay: 0.00001
num_epochs: 50
save_every: 10

# Loss parameters
ce_weight: 0.5  # Weight for cross-entropy loss
dice_weight: 0.5  # Weight for dice loss

# Output
output_dir: outputs/models
